name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Production needs node:sqlite (22.5+). The dev toolchain needs 22.13+; 22.17 is
          # also the locally verified release and avoids npm 10.8.2's incomplete npm-ci bug.
          node-version: 22.17.0
          cache: npm

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Dash sweep (no em or en dashes)
        run: npm run dash:sweep

      - name: Typecheck
        run: npm run typecheck

      - name: Verify committed JSON schema is up to date
        run: |
          npm run schema:gen
          git diff --exit-code schema/edit-plan.schema.json

      - name: Build
        run: npm run build

      - name: Doctor
        run: npm run doctor

      - name: Test (unit and render/QA integration)
        run: npm test
        env:
          # Remotion downloads a headless browser on first render.
          REMOTION_DISABLE_TELEMETRY: "1"
